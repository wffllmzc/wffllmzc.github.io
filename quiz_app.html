                answer: 2
            },
            {
                question: "数据行业合作主要针对的企业和机构是()",
                options: ["小型企业和初创公司", "拥有庞大和高质量数据资源的行业企业与机构", "政府部门和官方机构", "教育和学术机构"],

        let currentIndex = 0;
        let selectedAnswer = null;
        let answered = new Array(questions.length).fill(false);
        let results = new Array(questions.length).fill(null);
        let isReviewMode = false;
        let wrongQuestions = [];
        
        const questionNumberEl = document.getElementById('question-number');
        const questionTextEl = document.getElementById('question-text');
        const optionsEl = document.getElementById('options');
        const feedbackEl = document.getElementById('feedback');
        const correctAnswerEl = document.getElementById('correct-answer');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const currentQuestionEl = document.getElementById('current-question');
        const progressFillEl = document.getElementById('progress-fill');
        const correctCountEl = document.getElementById('correct-count');
        const wrongCountEl = document.getElementById('wrong-count');
        const unansweredCountEl = document.getElementById('unanswered-count');
        const resultModal = document.getElementById('result-modal');
        const finalScoreEl = document.getElementById('final-score');
        const resultTextEl = document.getElementById('result-text');
        const restartBtn = document.getElementById('restart-btn');
        const reviewBtn = document.getElementById('review-btn');
        const reviewWrongBtn = document.getElementById('review-wrong-btn');
        const saveStatusEl = document.getElementById('save-status');
        
        function saveProgress() {
            const data = {
                currentIndex,
                selectedAnswer,
                answered,
                results,
                timestamp: Date.now()
            };
            localStorage.setItem('quizProgress', JSON.stringify(data));
            saveStatusEl.textContent = '进度已自动保存 ' + new Date().toLocaleTimeString();
        }
        
        function loadProgress() {
            const saved = localStorage.getItem('quizProgress');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    currentIndex = data.currentIndex || 0;
                    selectedAnswer = data.selectedAnswer;
                    answered = data.answered || new Array(questions.length).fill(false);
                    results = data.results || new Array(questions.length).fill(null);
                    return true;
                } catch (e) {
                    return false;
                }
            }
            return false;
        }
        
        function clearProgress() {
            localStorage.removeItem('quizProgress');
        }
        
        function updateStats() {
            const correct = results.filter(r => r === true).length;
            const wrong = results.filter(r => r === false).length;
            const unanswered = results.filter(r => r === null).length;
            
            correctCountEl.textContent = correct;
            wrongCountEl.textContent = wrong;
            unansweredCountEl.textContent = unanswered;
        }
        
        function showQuestion() {
            if (isReviewMode) {
                showReviewQuestion();
                return;
            }
            
            const question = questions[currentIndex];
            
            questionNumberEl.textContent = `题目 ${currentIndex + 1}`;
            questionTextEl.textContent = question.question;
            currentQuestionEl.textContent = currentIndex + 1;
            
            const progress = ((currentIndex + 1) / questions.length) * 100;
            progressFillEl.style.width = `${progress}%`;
            
            optionsEl.innerHTML = '';
            feedbackEl.classList.remove('show', 'correct', 'wrong');
            
            question.options.forEach((option, index) => {
                const li = document.createElement('li');
                li.className = 'option';
                li.dataset.index = index;
                
                const letter = String.fromCharCode(65 + index);
                
                li.innerHTML = `
                    <span class="option-letter">${letter}</span>
                    <span class="option-text">${option}</span>
                `;
                
                if (answered[currentIndex]) {
                    li.classList.add('disabled');
                    if (index === question.answer) {
                        li.classList.add('correct');
                    } else if (index === selectedAnswer) {
                        li.classList.add('wrong');
                    }
                } else if (selectedAnswer === index) {
                    li.classList.add('selected');
                }
                
                li.addEventListener('click', () => {
                    if (!answered[currentIndex]) {
                        selectOption(index);
                    }
                });
                
                optionsEl.appendChild(li);
            });
            
            updateButtons();
            
            if (answered[currentIndex]) {
                showFeedback();
            }
            
            saveProgress();
        }
        
        function showReviewQuestion() {
            if (wrongQuestions.length === 0) {
                alert('没有错题可以复习！');
                exitReviewMode();
                return;
            }
            
            const questionIndex = wrongQuestions[currentIndex];
            const question = questions[questionIndex];
            
            questionNumberEl.textContent = `错题复习 ${currentIndex + 1}/${wrongQuestions.length}`;
            questionTextEl.textContent = `(原题${questionIndex + 1}) ${question.question}`;
            currentQuestionEl.textContent = currentIndex + 1;
            
            const progress = ((currentIndex + 1) / wrongQuestions.length) * 100;
            progressFillEl.style.width = `${progress}%`;
            
            optionsEl.innerHTML = '';
            feedbackEl.classList.remove('show', 'correct', 'wrong');
            
            question.options.forEach((option, index) => {
                const li = document.createElement('li');
                li.className = 'option';
                li.dataset.index = index;
                
                const letter = String.fromCharCode(65 + index);
                
                li.innerHTML = `
                    <span class="option-letter">${letter}</span>
                    <span class="option-text">${option}</span>
                `;
                
                if (selectedAnswer === index) {
                    li.classList.add('selected');
                }
                
                li.addEventListener('click', () => {
                    selectOption(index);
                });
                
                optionsEl.appendChild(li);
            });
            
            updateReviewButtons();
        }
        
        function enterReviewMode() {
            wrongQuestions = results.map((r, i) => r === false ? i : -1).filter(i => i !== -1);
            
            if (wrongQuestions.length === 0) {
                alert('恭喜！没有错题可以复习！');
                return;
            }
            
            isReviewMode = true;
            currentIndex = 0;
            selectedAnswer = null;
            
            reviewBtn.textContent = '退出复习';
            reviewBtn.style.background = '#ef4444';
            
            showReviewQuestion();
        }
        
        function exitReviewMode() {
            isReviewMode = false;
            currentIndex = 0;
            selectedAnswer = null;
            
            reviewBtn.textContent = '复习错题';
            reviewBtn.style.background = '#f59e0b';
            
            showQuestion();
        }
        
        function updateReviewButtons() {
            prevBtn.disabled = currentIndex === 0;
            
            if (selectedAnswer === null) {
                nextBtn.textContent = '下一题';
                nextBtn.onclick = () => {
                    if (currentIndex < wrongQuestions.length - 1) {
                        currentIndex++;
                        selectedAnswer = null;
                        showReviewQuestion();
                    } else {
                        alert('错题复习完成！');
                        exitReviewMode();
                    }
                };
            } else {
                const questionIndex = wrongQuestions[currentIndex];
                const question = questions[questionIndex];
                const isCorrect = selectedAnswer === question.answer;
                
                nextBtn.textContent = '确认答案';
                nextBtn.onclick = () => {
                    document.querySelectorAll('.option').forEach((el, i) => {
                        el.classList.add('disabled');
                        el.classList.remove('selected');
                        
                        if (i === question.answer) {
                            el.classList.add('correct');
                        } else if (i === selectedAnswer && !isCorrect) {
                            el.classList.add('wrong');
                        }
                    });
                    
                    feedbackEl.classList.add('show');
                    if (isCorrect) {
                        feedbackEl.classList.add('correct');
                        feedbackEl.classList.remove('wrong');
                        correctAnswerEl.textContent = '回答正确！';
                    } else {
                        feedbackEl.classList.add('wrong');
                        feedbackEl.classList.remove('correct');
                        const correctLetter = String.fromCharCode(65 + question.answer);
                        correctAnswerEl.textContent = `回答错误！正确答案是：${correctLetter}`;
                    }
                    
                    nextBtn.textContent = '下一题';
                    nextBtn.onclick = () => {
                        if (currentIndex < wrongQuestions.length - 1) {
                            currentIndex++;
                            selectedAnswer = null;
                            showReviewQuestion();
                        } else {
                            alert('错题复习完成！');
                            exitReviewMode();
                        }
                    };
                };
            }
        }
        
        function selectOption(index) {
            selectedAnswer = index;
            
            document.querySelectorAll('.option').forEach((el, i) => {
                el.classList.remove('selected');
                if (i === index) {
                    el.classList.add('selected');
                }
            });
            
            updateButtons();
        }
        
        function showFeedback() {
            const question = questions[currentIndex];
            const isCorrect = selectedAnswer === question.answer;
            
            feedbackEl.classList.add('show');
            
            if (isCorrect) {
                feedbackEl.classList.add('correct');
                feedbackEl.classList.remove('wrong');
                correctAnswerEl.textContent = '回答正确！';
            } else {
                feedbackEl.classList.add('wrong');
                feedbackEl.classList.remove('correct');
                const correctLetter = String.fromCharCode(65 + question.answer);
                correctAnswerEl.textContent = `回答错误！正确答案是：${correctLetter}`;
            }
        }
        
        function updateButtons() {
            prevBtn.disabled = currentIndex === 0;
            
            if (!answered[currentIndex] && selectedAnswer === null) {
                nextBtn.textContent = '下一题';
                nextBtn.onclick = goToNext;
            } else if (!answered[currentIndex] && selectedAnswer !== null) {
                nextBtn.textContent = '确认答案';
                nextBtn.onclick = confirmAnswer;
            } else {
                nextBtn.textContent = '下一题';
                nextBtn.onclick = goToNext;
            }
        }
        
        function confirmAnswer() {
            const question = questions[currentIndex];
            const isCorrect = selectedAnswer === question.answer;
            
            answered[currentIndex] = true;
            results[currentIndex] = isCorrect;
            
            document.querySelectorAll('.option').forEach((el, i) => {
                el.classList.add('disabled');
                el.classList.remove('selected');
                
                if (i === question.answer) {
                    el.classList.add('correct');
                } else if (i === selectedAnswer) {
                    el.classList.add('wrong');
                }
            });
            
            showFeedback();
            updateStats();
            updateButtons();
            saveProgress();
        }
        
        function goToNext() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                selectedAnswer = answered[currentIndex] ? 
                    (results[currentIndex] ? questions[currentIndex].answer : 
                     [...questions[currentIndex].options.keys()].find(i => i !== questions[currentIndex].answer)) : null;
                showQuestion();
            } else {
                showResult();
            }
        }
        
        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                selectedAnswer = answered[currentIndex] ? 
                    (results[currentIndex] ? questions[currentIndex].answer : 
                     [...questions[currentIndex].options.keys()].find(i => i !== questions[currentIndex].answer)) : null;
                showQuestion();
            }
        });
        
        function showResult() {
            const correct = results.filter(r => r === true).length;
            const total = questions.length;
            const percentage = Math.round((correct / total) * 100);
            
            finalScoreEl.textContent = `${correct}/${total}`;
            
            let text = '';
            if (percentage >= 90) {
                text = '太棒了！你是人工智能训练师的高手！';
            } else if (percentage >= 70) {
                text = '不错！继续努力，你会做得更好！';
            } else if (percentage >= 60) {
                text = '及格了，但还有提升空间，继续加油！';
            } else {
                text = '需要多加练习，加油！';
            }
            
            resultTextEl.textContent = text;
            resultModal.classList.add('show');
        }
        
        restartBtn.addEventListener('click', () => {
            currentIndex = 0;
            selectedAnswer = null;
            answered = new Array(questions.length).fill(false);
            results = new Array(questions.length).fill(null);
            resultModal.classList.remove('show');
            clearProgress();
            updateStats();
            showQuestion();
        });
        
        reviewBtn.addEventListener('click', () => {
            if (isReviewMode) {
                exitReviewMode();
            } else {
                enterReviewMode();
            }
        });
        
        reviewWrongBtn.addEventListener('click', () => {
            resultModal.classList.remove('show');
            enterReviewMode();
        });
        
        if (loadProgress()) {
            saveStatusEl.textContent = '已恢复上次进度 ' + new Date().toLocaleTimeString();
        }
        
        updateStats();
        showQuestion();
    </script>
