<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI训练师刷题系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .header h1 {
            color: #667eea;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #888;
            font-size: 14px;
            margin-top: 5px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            margin-top: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .question-type {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .question-number {
            color: #888;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 18px;
            line-height: 1.8;
            color: #333;
            margin-bottom: 25px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option {
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 16px;
        }

        .option:hover {
            border-color: #667eea;
            background: #f8f9ff;
            transform: translateX(5px);
        }

        .option.selected {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .option.correct {
            border-color: #4caf50;
            background: #4caf50;
            color: white;
        }

        .option.wrong {
            border-color: #f44336;
            background: #f44336;
            color: white;
        }

        .option.disabled {
            pointer-events: none;
            opacity: 0.6;
        }

        .btn-container {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .btn {
            flex: 1;
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .btn-warning {
            background: #ff9800;
            color: white;
        }

        .explanation {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9ff;
            border-radius: 12px;
            border-left: 4px solid #667eea;
            display: none;
        }

        .explanation.show {
            display: block;
        }

        .result-icon {
            text-align: center;
            font-size: 60px;
            margin: 20px 0;
        }

        .result-text {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .result-detail {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            line-height: 1.8;
        }

        .hidden {
            display: none;
        }

        .judgment-options {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .judgment-option {
            width: 80px;
            height: 80px;
            border: 3px solid #e0e0e0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .judgment-option:hover {
            border-color: #667eea;
            transform: scale(1.1);
        }

        .judgment-option.selected {
            border-color: #667eea;
            background: #667eea;
        }

        .judgment-option.correct {
            border-color: #4caf50;
            background: #4caf50;
        }

        .judgment-option.wrong {
            border-color: #f44336;
            background: #f44336;
        }

        .judgment-option.disabled {
            pointer-events: none;
            opacity: 0.6;
        }

        .mode-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .mode-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .nav-button {
            background: #4caf50;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin-left: 10px;
        }

        .nav-panel {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-height: 400px;
            overflow-y: auto;
        }

        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .nav-title {
            font-size: 18px;
            color: #667eea;
            font-weight: bold;
        }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 8px;
        }

        .nav-item {
            padding: 8px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s ease;
        }

        .nav-item:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .nav-item.current {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .nav-item.correct {
            border-color: #4caf50;
            background: #4caf50;
            color: white;
        }

        .nav-item.wrong {
            border-color: #f44336;
            background: #f44336;
            color: white;
        }

        .nav-item.bookmarked {
            border-color: #ff9800;
            background: #fff3e0;
        }

        .nav-item-answered {
            background: #e8f5e9;
        }

        .nav-stats {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            font-size: 13px;
            color: #666;
        }

        .error-record {
            background: #fff3e0;
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
        }

        .error-title {
            color: #f57c00;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .error-count {
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AI训练师刷题系统</h1>
            <div class="subtitle">完整题库 | 简洁高效</div>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-number" id="correctCount">0</div>
                    <div class="stat-label">答对</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="wrongCount">0</div>
                    <div class="stat-label">答错</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="totalCount">0</div>
                    <div class="stat-label">总计</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="accuracy">0%</div>
                    <div class="stat-label">正确率</div>
                </div>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
        </div>

        <!-- 开始界面 -->
        <div id="startScreen" class="card">
            <h2 style="text-align: center; margin-bottom: 30px; color: #333;">选择刷题模式</h2>
            
            <div class="mode-selector">
                <button class="mode-btn active" onclick="setMode('random')">🎲 随机刷题</button>
                <button class="mode-btn" onclick="setMode('sequence')">🔢 顺序刷题</button>
                <button class="mode-btn" onclick="setMode('error')">⚠️ 错题重练</button>
            </div>
            
            <div style="text-align: center; color: #888; margin-bottom: 20px;">
                <label style="font-size: 16px; margin-right: 10px;">题目数量:</label>
                <select id="questionCount" style="padding: 8px 15px; font-size: 14px; border-radius: 8px; border: 1px solid #ddd;">
                    <option value="10">10题</option>
                    <option value="20" selected>20题</option>
                    <option value="50">50题</option>
                    <option value="100">100题</option>
                    <option value="all">全部题目</option>
                </select>
            </div>
            
            <button class="btn btn-primary" onclick="startQuiz()" style="width: 100%; margin-top: 20px;">
                🎯 开始刷题
            </button>
        </div>

        <!-- 答题界面 -->
        <div id="quizScreen" class="card hidden">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div class="question-type" id="questionType">选择题</div>
                <button class="nav-button" onclick="toggleNavigation()">
                    📋 题目导航
                </button>
            </div>
            <div class="question-number" id="questionNumber">第 1 题</div>
            <div class="question-text" id="questionText"></div>
            <div id="optionsContainer"></div>
            
            <!-- 题目导航面板 -->
            <div class="nav-panel hidden" id="navPanel">
                <div class="nav-header">
                    <div class="nav-title">📋 题目导航</div>
                    <button class="btn btn-secondary" onclick="toggleNavigation()" style="padding: 6px 12px; font-size: 12px;">
                        ✕ 关闭
                    </button>
                </div>
                <div class="nav-grid" id="navGrid">
                    <!-- 题目卡片将动态生成 -->
                </div>
                <div class="nav-stats">
                    <span>✅ 已答对: <strong id="navCorrect">0</strong></span>
                    <span>❌ 已答错: <strong id="navWrong">0</strong></span>
                    <span>⏸️ 未答: <strong id="navUnanswered">0</strong></span>
                    <span>⭐ 已收藏: <strong id="navBookmarked">0</strong></span>
                </div>
            </div>
            
            <div class="btn-container">
                <button class="btn btn-secondary" onclick="showExplanation()" id="explainBtn">💡 查看解析</button>
                <button class="btn btn-warning" onclick="bookmarkQuestion()" id="bookmarkBtn">⭐ 收藏</button>
                <button class="btn btn-primary" onclick="nextQuestion()" id="nextBtn">下一题 →</button>
            </div>
            
            <div class="btn-container" style="margin-top: 10px;">
                <button class="btn btn-secondary" onclick="goBackToStart()" style="flex: 1;">
                    ← 返回
                </button>
                <button class="btn btn-warning" onclick="startErrorReview()" id="errorReviewBtn" style="display: none; flex: 1;">
                    ⚠️ 重新刷错题
                </button>
            </div>
            
            <div class="explanation" id="explanation"></div>
        </div>

        <!-- 结果界面 -->
        <div id="resultScreen" class="card hidden">
            <div class="result-icon">🎉</div>
            <div class="result-text">刷题完成!</div>
            <div class="result-detail" id="resultDetail"></div>
            
            <div class="error-record" id="errorRecord" style="display: none;">
                <div class="error-title">⚠️ 错题记录</div>
                <div class="error-count" id="errorCount"></div>
            </div>
            
            <div style="display: flex; gap: 15px; margin-top: 30px; flex-wrap: wrap;">
                <button class="btn btn-warning" onclick="reviewErrors()" id="reviewBtn" style="display: none; flex: 1;">
                    🔍 重新刷错题
                </button>
                <button class="btn btn-primary" onclick="restartQuiz()" style="flex: 1;">
                    🔄 重新刷题
                </button>
            </div>
        </div>
    </div>

    <script>
const questionBank = [

    // 第5题
    {id:5,type:'judgment',question:'全样检验需要质检员对已完成标注的数据集进行集中全量检验。',answer:true,explanation:'全样检验要求质检员对全部数据进行检验,确保数据质量。'},

    // 第27题

    {id:297,type:'choice',question:'语音标注的方法主要应用于处理什么的任务:',options:['语音合成和声纹识别','语音分割和自然语言处理','语音输入和语音合成','语音识别和音频转写'],answer:1,explanation:'语音标注用于语音分割和自然语言处理。'},
    
    // 第298题
    {id:298,type:'choice',question:'意图代表客户明确要问的事情,其中"天气"领域的一个意图可能是:',options:['查询新闻','查询美食','查询天气','查询电影名'],answer:2,explanation:'天气领域的意图是查询天气。'},
    
    // 第299题
    {id:299,type:'choice',question:'在计算机中,打开应用程序的正确方式是:',options:['点击屏幕','双击应用程序图标','将应用程序图标复制到新位置','拔掉计算机电源线'],answer:1,explanation:'双击图标打开应用程序。'},
    
    // 第300题
    {id:300,type:'choice',question:'为了让机器学习从数据中更准确有效地获得规律,数据标注的工作主要是对什么进行加工操作:',options:['数据的来源和采集方式','数据的处理和存储方式','数据的格式和编码方式','数据的归类、整理、标记等操作'],answer:3,explanation:'数据标注对数据进行归类、整理、标记等操作。'}
];
    </script>
    
    <script>
        let currentMode = 'random';
        let currentQuestions = [];
        let currentIndex = 0;
        let correctCount = 0;
        let wrongCount = 0;
        let hasAnswered = false;
        let errorList = [];
        let bookmarkList = [];
        let answeredQuestions = []; // 记录已答题目的状态

        function loadFromStorage() {
            const savedErrors = localStorage.getItem('aiTrainerErrors');
            const savedBookmarks = localStorage.getItem('aiTrainerBookmarks');
            if (savedErrors) errorList = JSON.parse(savedErrors);
            if (savedBookmarks) bookmarkList = JSON.parse(savedBookmarks);
        }

        function saveToStorage() {
            localStorage.setItem('aiTrainerErrors', JSON.stringify(errorList));
            localStorage.setItem('aiTrainerBookmarks', JSON.stringify(bookmarkList));
        }

        loadFromStorage();

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            if (mode === 'error' && errorList.length === 0) {
                alert('暂无错题记录，请先进行刷题练习！');
                document.querySelector('.mode-btn').classList.add('active');
                event.target.classList.remove('active');
                currentMode = 'random';
            }
        }

        function startQuiz() {
            let questions;
            
            // 对题库按题号排序
            const sortedBank = [...questionBank].sort((a, b) => a.id - b.id);
            
            if (currentMode === 'error') {
                questions = shuffleArray([...errorList]);
            } else {
                const countSelect = document.getElementById('questionCount').value;
                const count = countSelect === 'all' ? sortedBank.length : parseInt(countSelect);
                
                if (currentMode === 'sequence') {
                    questions = sortedBank.slice(0, count);
                } else {
                    questions = shuffleArray([...sortedBank]).slice(0, count);
                }
            }
            
            currentQuestions = questions;
            currentIndex = 0;
            correctCount = 0;
            wrongCount = 0;
            answeredQuestions = []; // 重置答题状态
            updateStats();
            
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('quizScreen').classList.remove('hidden');
            document.getElementById('resultScreen').classList.add('hidden');
            
            showQuestion();
        }

        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function showQuestion() {
            if (currentIndex >= currentQuestions.length) {
                showResult();
                return;
            }
            
            const question = currentQuestions[currentIndex];
            const answeredStatus = answeredQuestions[currentIndex];
            hasAnswered = answeredStatus ? true : false;
            
            document.getElementById('questionType').textContent = question.type === 'choice' ? '选择题' : '判断题';
            document.getElementById('questionNumber').textContent = `题号: ${question.id} 题 / 总题数: ${currentQuestions.length} 题`;
            document.getElementById('questionText').textContent = question.question;
            
            const optionsContainer = document.getElementById('optionsContainer');
            
            if (question.type === 'choice') {
                optionsContainer.innerHTML = '<div class="options"></div>';
                const optionsDiv = optionsContainer.querySelector('.options');
                question.options.forEach((option, index) => {
                    const optionDiv = document.createElement('div');
                    optionDiv.className = 'option';
                    
                    // 如果已答题,显示状态
                    if (answeredStatus) {
                        optionDiv.classList.add('disabled');
                        if (index === answeredStatus.selected) {
                            optionDiv.classList.add(answeredStatus.correct ? 'correct' : 'wrong');
                        }
                        if (index === question.answer && !answeredStatus.correct) {
                            optionDiv.classList.add('correct');
                        }
                    }
                    
                    optionDiv.textContent = `${String.fromCharCode(65 + index)}. ${option}`;
                    if (!answeredStatus) {
                        optionDiv.onclick = () => selectOption(index, optionDiv);
                    }
                    optionsDiv.appendChild(optionDiv);
                });
            } else {
                optionsContainer.innerHTML = `
                    <div class="judgment-options">
                        <div class="judgment-option" onclick="selectJudgment(true, this)">✓</div>
                        <div class="judgment-option" onclick="selectJudgment(false, this)">✗</div>
                    </div>
                `;
                
                // 如果已答题,显示状态
                if (answeredStatus) {
                    const options = document.querySelectorAll('.judgment-option');
                    options.forEach(opt => opt.classList.add('disabled'));
                    if (answeredStatus.selected === true) {
                        options[0].classList.add(answeredStatus.correct ? 'correct' : 'wrong');
                    } else {
                        options[1].classList.add(answeredStatus.correct ? 'correct' : 'wrong');
                    }
                    if (!answeredStatus.correct) {
                        options[question.answer ? 0 : 1].classList.add('correct');
                    }
                }
            }
            
            const bookmarkBtn = document.getElementById('bookmarkBtn');
            bookmarkBtn.textContent = bookmarkList.some(b => b.id === question.id) ? '⭐ 已收藏' : '⭐ 收藏';
            bookmarkBtn.className = bookmarkList.some(b => b.id === question.id) ? 'btn btn-warning' : 'btn btn-secondary';
            
            document.getElementById('explanation').classList.remove('show');
            if (!answeredStatus) {
                document.getElementById('explainBtn').style.display = 'inline-block';
            }
            document.getElementById('nextBtn').textContent = currentIndex < currentQuestions.length - 1 ? '下一题 →' : '完成 ✓';
            
            // 更新"重新刷错题"按钮显示状态
            const errorReviewBtn = document.getElementById('errorReviewBtn');
            if (errorList.length > 0 && currentMode !== 'error') {
                errorReviewBtn.style.display = 'inline-block';
                errorReviewBtn.textContent = `⚠️ 重新刷错题(${errorList.length}题)`;
            } else {
                errorReviewBtn.style.display = 'none';
            }
            
            updateProgress();
            updateNavigation(); // 更新导航面板
        }

        function selectOption(index, element) {
            if (hasAnswered) return;
            hasAnswered = true;
            
            const question = currentQuestions[currentIndex];
            const options = document.querySelectorAll('.option');
            
            options.forEach(opt => opt.classList.add('disabled'));
            
            const isCorrect = index === question.answer;
            
            if (isCorrect) {
                element.classList.add('correct');
                correctCount++;
                errorList = errorList.filter(e => e.id !== question.id);
            } else {
                element.classList.add('wrong');
                options[question.answer].classList.add('correct');
                wrongCount++;
                if (!errorList.some(e => e.id === question.id)) {
                    errorList.push(question);
                }
            }
            
            // 记录答题状态
            answeredQuestions[currentIndex] = {
                selected: index,
                correct: isCorrect
            };
            
            saveToStorage();
            updateStats();
            updateNavigation();
        }

        function selectJudgment(value, element) {
            if (hasAnswered) return;
            hasAnswered = true;
            
            const question = currentQuestions[currentIndex];
            const options = document.querySelectorAll('.judgment-option');
            
            options.forEach(opt => opt.classList.add('disabled'));
            
            const isCorrect = value === question.answer;
            
            if (isCorrect) {
                element.classList.add('correct');
                correctCount++;
                errorList = errorList.filter(e => e.id !== question.id);
            } else {
                element.classList.add('wrong');
                options[question.answer ? 0 : 1].classList.add('correct');
                wrongCount++;
                if (!errorList.some(e => e.id === question.id)) {
                    errorList.push(question);
                }
            }
            
            // 记录答题状态
            answeredQuestions[currentIndex] = {
                selected: value,
                correct: isCorrect
            };
            
            saveToStorage();
            updateStats();
            updateNavigation();
        }

        function toggleNavigation() {
            const navPanel = document.getElementById('navPanel');
            navPanel.classList.toggle('hidden');
            updateNavigation();
        }

        function updateNavigation() {
            const navGrid = document.getElementById('navGrid');
            navGrid.innerHTML = '';
            
            currentQuestions.forEach((q, index) => {
                const navItem = document.createElement('div');
                navItem.className = 'nav-item';
                
                const isBookmarked = bookmarkList.some(b => b.id === q.id);
                const answered = answeredQuestions[index];
                
                // 设置状态样式
                if (index === currentIndex) {
                    navItem.classList.add('current');
                }
                
                if (answered) {
                    if (answered.correct) {
                        navItem.classList.add('correct');
                    } else {
                        navItem.classList.add('wrong');
                    }
                }
                
                if (isBookmarked) {
                    navItem.classList.add('bookmarked');
                }
                
                // 显示题号
                navItem.innerHTML = `${q.id}`;
                if (isBookmarked) {
                    navItem.innerHTML += ' ⭐';
                }
                
                navItem.onclick = () => jumpToQuestion(index);
                navGrid.appendChild(navItem);
            });
            
            // 更新统计信息
            const answeredCount = answeredQuestions.filter(a => a).length;
            const correctAnswered = answeredQuestions.filter(a => a && a.correct).length;
            const wrongAnswered = answeredQuestions.filter(a => a && !a.correct).length;
            const bookmarkedCount = currentQuestions.filter(q => bookmarkList.some(b => b.id === q.id)).length;
            
            document.getElementById('navCorrect').textContent = correctAnswered;
            document.getElementById('navWrong').textContent = wrongAnswered;
            document.getElementById('navUnanswered').textContent = currentQuestions.length - answeredCount;
            document.getElementById('navBookmarked').textContent = bookmarkedCount;
        }

        function jumpToQuestion(index) {
            currentIndex = index;
            showQuestion();
        }

        function showExplanation() {
            const question = currentQuestions[currentIndex];
            const explanationDiv = document.getElementById('explanation');
            explanationDiv.innerHTML = `<strong>💡 解析:</strong> ${question.explanation}`;
            explanationDiv.classList.add('show');
            document.getElementById('explainBtn').style.display = 'none';
        }

        function bookmarkQuestion() {
            const question = currentQuestions[currentIndex];
            const bookmarkBtn = document.getElementById('bookmarkBtn');
            
            if (bookmarkList.some(b => b.id === question.id)) {
                bookmarkList = bookmarkList.filter(b => b.id !== question.id);
                bookmarkBtn.textContent = '⭐ 收藏';
                bookmarkBtn.className = 'btn btn-secondary';
            } else {
                bookmarkList.push(question);
                bookmarkBtn.textContent = '⭐ 已收藏';
                bookmarkBtn.className = 'btn btn-warning';
            }
            
            saveToStorage();
            updateNavigation();
        }

        function nextQuestion() {
            currentIndex++;
            
            if (currentIndex >= currentQuestions.length) {
                showResult();
            } else {
                showQuestion();
            }
        }

        function goBackToStart() {
            if (currentIndex > 0 && correctCount + wrongCount > 0) {
                if (!confirm(`当前已答${correctCount + wrongCount}题，确定要返回吗？错题记录将会保留。`)) {
                    return;
                }
            }
            
            document.getElementById('quizScreen').classList.add('hidden');
            document.getElementById('startScreen').classList.remove('hidden');
            document.getElementById('resultScreen').classList.add('hidden');
        }

        function showResult() {
            document.getElementById('quizScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.remove('hidden');
            
            const total = correctCount + wrongCount;
            const accuracy = total > 0 ? Math.round((correctCount / total) * 100) : 0;
            
            document.getElementById('resultDetail').innerHTML = `
                你答对了 <strong style="color: #4caf50;">${correctCount}</strong> 题，
                答错了 <strong style="color: #f44336;">${wrongCount}</strong> 题，
                正确率 <strong style="color: #667eea;">${accuracy}%</strong>
            `;
            
            if (wrongCount > 0) {
                document.getElementById('errorRecord').style.display = 'block';
                document.getElementById('errorCount').innerHTML = `本次错题 ${wrongCount} 题，累计错题 ${errorList.length} 题`;
                document.getElementById('reviewBtn').style.display = 'inline-block';
            } else {
                document.getElementById('errorRecord').style.display = 'none';
                document.getElementById('reviewBtn').style.display = 'none';
            }
        }

        function reviewErrors() {
            currentMode = 'error';
            
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('quizScreen').classList.remove('hidden');
            
            currentQuestions = shuffleArray([...errorList]);
            currentIndex = 0;
            correctCount = 0;
            wrongCount = 0;
            answeredQuestions = [];
            updateStats();
            showQuestion();
        }

        function restartQuiz() {
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('startScreen').classList.remove('hidden');
        }

        function startErrorReview() {
            if (errorList.length === 0) {
                alert('当前没有错题,无法重新刷错题!');
                return;
            }
            
            if (!confirm(`当前有${errorList.length}道错题,确定要重新刷错题吗?当前答题进度将会清空。`)) {
                return;
            }
            
            currentMode = 'error';
            
            currentQuestions = shuffleArray([...errorList]);
            currentIndex = 0;
            correctCount = 0;
            wrongCount = 0;
            answeredQuestions = [];
            updateStats();
            showQuestion();
        }

        function updateStats() {
            const total = correctCount + wrongCount;
            const accuracy = total > 0 ? Math.round((correctCount / total) * 100) : 0;
            
            document.getElementById('correctCount').textContent = correctCount;
            document.getElementById('wrongCount').textContent = wrongCount;
            document.getElementById('totalCount').textContent = total;
            document.getElementById('accuracy').textContent = accuracy + '%';
        }

        function updateProgress() {
            const progress = ((currentIndex + 1) / currentQuestions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }
    </script>
</body>
</html>
